<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed — Victorias Luxury SPA & WELLNESS</title>
<link rel="icon" href="images/logo-mark.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .confirm-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--near-black); padding: 24px; }
  .confirm-card { background: var(--cream); border-radius: var(--radius); padding: 56px 44px; max-width: 480px; text-align: center; box-shadow: var(--shadow-soft); }
  .confirm-card img { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 22px; }
  .confirm-card h1 { font-size: 30px; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="confirm-wrap">
    <div class="confirm-card">
      <img src="images/logo-mark.jpg" alt="Victorias">
      <p class="eyebrow">Thank You</p>
      <h1>Your Booking is Confirmed</h1>
      <p>We've received your deposit and your appointment is secured. A confirmation has been sent to your email — we look forward to welcoming you to Victorias Luxury SPA &amp; WELLNESS.</p>
      <a href="index.html" class="btn btn-gold" style="margin-top:12px;">Back to Home</a>
    </div>
  </div>

</html>
